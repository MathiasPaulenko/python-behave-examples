# ===================================================================
# behave.ini — configuration for the Behave runner
#
# This file demonstrates how to register custom formatters from the
# behave-* ecosystem, run several reports at once, tag-filter
# scenarios, and pass key=value pairs to environment.py via userdata.
#
# Doc: https://behave.readthedocs.io/en/latest/behave.html#configuration-files
# ===================================================================
[behave]
# Output formatters (can be used together — one report per -f/-o pair):
#   plain               → console output (default)
#   progress3           → scenario dots, one per scenario
#   json                → Cucumber-style JSON per feature
#   modern              → modern-html single-file report
#   cucumber-json       → machine-readable JSON for external tooling
#   modern-md           → Markdown report
#   steps               → step catalog HTML (static analysis of step defs)
#   behave-trace        → trace.json for the behave-trace viewer
#   csv/xlsx/ods-modern → spreadsheet reports (behave-modern-sheets-report)
#   behave-modern-txt/docx/pdf → document reports (behave-modern-file-report)
format = plain
       progress3
       json
       modern
       cucumber-json
       modern-md
       steps
       behave-trace
       csv-modern
       xlsx-modern
       behave-modern-txt
       behave-modern-docx

# One output file per formatter (same order as 'format').
outfiles = reports/plain.txt
           reports/progress3.txt
           reports/results.json
           reports/behave_modern_html_report.html
           reports/cucumber.json
           reports/behave_modern_md_report.md
           reports/steps_catalog.html
           reports/trace.json
           reports/report.csv
           reports/report.xlsx
           reports/report.txt
           reports/report.docx

# Tag expression applied to every run (behave-runner profiles can override).
default_tags = not @wip

# Show untested/skipped steps in reports.
show_skipped = true
show_timings = false

# Stop on the first failure (handy for local debugging).
stop = false

# Register custom formatters — alias = module.path:ClassName.
[behave.formatters]
modern       = behave_modern_html_report.formatter:ModernHTMLFormatter
steps        = behave_modern_html_report.step_catalog_formatter:StepCatalogFormatter
steps-cucumber = behave.formatter.steps_cucumber:StepsCucumberFormatter
cucumber-json  = behave_modern_json_report.formatter:ModernJSONFormatter
progress3    = behave.formatter.progress:ScenarioProgressFormatter
modern-md    = behave_modern_md_report.formatter:BehaveMarkdownFormatter
behave-trace = behave_trace.formatter:TraceFormatter
csv-modern   = behave_modern_sheets_report.csv_formatter:CSVFormatter
xlsx-modern  = behave_modern_sheets_report.xlsx_formatter:XLSXFormatter
ods-modern   = behave_modern_sheets_report.ods_formatter:ODSFormatter
behave-modern-pdf  = behave_modern_file_report.pdf_formatter:PDFFormatter
behave-modern-docx = behave_modern_file_report.docx_formatter:DOCXFormatter
behave-modern-txt  = behave_modern_file_report.txt_formatter:TXTFormatter

# Named runners — select with `behave --runner=<alias>`.
# behave-pool's ParallelRunner executes work units in isolated processes.
[behave.runners]
parallel = behave_pool:ParallelRunner

# Arbitrary key=value pairs, available as context.config.userdata
# and as formatter/report options.
[behave.userdata]
# --- SUT ---
api_url = http://localhost:5000
host = localhost
port = 5000
app_start_timeout = 5.0

# --- behave-modern-html-report (bmr.*) ---
bmr.title = Python Behave Examples
bmr.theme = auto

# --- behave-modern-file-report (bmfr.*) ---
bmfr.title = Behave Examples Report
bmfr.project_name = python-behave-examples
bmfr.pdf_engine = reportlab

# --- behave-modern-sheets-report ---
report_columns = feature,scenario,status,duration,tags,error
report_history_path = reports/.behave-sheets-history.json

# --- behave-pool (used when --runner=parallel) ---
pool.scheme = feature
pool.balance = lpt
pool.report = reports/behave-pool-report.json
